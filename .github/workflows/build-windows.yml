name: Build Windows ERP
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AutoPecasConcorrenteERP.sln
      - name: Build Release
        run: dotnet build AutoPecasConcorrenteERP.sln -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish AutoPecasERP.Desktop/AutoPecasERP.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc 'Installer\AutoPecasERP.iss'
      - name: Upload ERP portable
        uses: actions/upload-artifact@v4
        with:
          name: AutoPecasConcorrenteERP-win-x64
          path: publish/win-x64/**
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-PECAS-CONCORRENTE-ERP-SETUP
          path: Installer/Output/*.exe
      - name: Publish installer EXE in GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem 'Installer\Output\*.exe' | Select-Object -First 1
          gh release create v1.0.0 $exe.FullName --title "Auto Pecas Concorrente ERP 1.0.0" --notes "Instalador Windows x64 do Auto Pecas Concorrente ERP."
