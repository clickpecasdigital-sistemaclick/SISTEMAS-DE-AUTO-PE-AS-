name: Build Windows ERP
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AutoPecasConcorrenteERP.sln
      - name: Build Release
        run: dotnet build AutoPecasConcorrenteERP.sln -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish src/AutoPecasERP.Desktop/AutoPecasERP.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
      - name: Upload ERP
        uses: actions/upload-artifact@v4
        with:
          name: AutoPecasConcorrenteERP-win-x64
          path: publish/win-x64/**
